syntax = "proto3";

option csharp_namespace = "DotnetWorkoutKit.Protobuf.CustomWorkout.Alert";

message SpeedAlert {
    SpeedRangeAlert speed_range_alert = 2;

    message SpeedRangeAlert {
        SpeedBound lower_bound = 1;
        SpeedBound upper_bound = 2;
    }

    message SpeedBound {
        Speed speed = 1;
        TimeUnit time_unit = 2;
    }

    message Speed {
        enum SpeedUnitEnum {
            UNSPECIFIED = 0;
            METERS_PER_SECOND = 1;
        }

        SpeedUnitEnum unit = 1;
        double speed = 2;
    }

    message TimeUnit {
        uint32 unit = 1;
        double value = 2;
    }
}